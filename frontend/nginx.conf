server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas como /relatar e /admin/painel caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
